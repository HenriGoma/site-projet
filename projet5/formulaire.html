<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inscription Nouveau Client - Mediterranée</title>
</head>
<body>
	<header>
		<h1>Inscription d'un Nouveau Client</h1>
	</header>
<section>
<form action="#" method="post">
	<table border="0">
	<tr>
		<td><label for="nom">Nom :</label></td>
		<td><input type="text" name="nom"></td>
	</tr>
	<tr>
		<td><label for="prenom">Prénom :</label></td>
		<td><input type="text" id= "prénom" name="nom"></td>
	</tr>
	<tr>
		<td><label for="date naissance">Date de naissance :</label></td>
		<td><input type="date" id="date naissance" name="date naissance"></td>
	</tr>
	<tr>
		<td><label for="email">Adresse mail :</label></td>
		<td><input type="email" id="email" name="email"></td>
	</tr>
	<tr>
		<td><label for="mdp">Mot de passe :</label></td>
		<td><input type="mdp" id="mdp" name="mdp"></td>
	</tr>
	<tr>
		<td><label for="permis">Numéro de permis :</label></td>
		<td><input type="text" id="permis" name="permis"></td>
	</tr>
	<tr>
		<td><label for="anciennete">Nombre d'années d'anciennete :</label></td>
		<td><input type="number" id="anciennete" name="anciennete"> </td>
	<tr> <td><label for="ville">ville</label> </td>
		<td> <select id="ville" name="ville">
		<option value="paris">Paris</option>
		<option value="versailles">Versailles</option><option value="créteil">Créteil</option> </td> </tr>
		</select>
	</tr>
	<tr>
		<td><label for="adresse">Adresse du client :</label></td>
		<td><textarea id="adresse" name="adresse" rows="4" cols="30"></textarea></td>
	</tr>
	</table>
		<p>Situation matrimoniale</p>
	<tr>
		<td><label for="marie oui">Marié</label></td>
		<td><input type="radio" id="marie oui" name="marie"value="oui"></td>
	</tr> 
		<label for="marie oui">Marié</label> 
		<input type="radio" id="marie non" name="marie"value="non">
		<p>Préference de voiture :</p>
	<label for="pref_auto">Automatique</label>
		<input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
	<label for="pref_auto">Manuelle</label>
		<input type="checkbox" id="pref_auto" name="preference_auto" value="manuelle">
		<button type="submit">Enregistrer</button>
		<button type="reset">Annuler</button>
	</table>
	</form>
</section>
	<footer>
		<p>&copy: 2026 Agence Méditerranée - Location de véhicules</p>
		
</body>
</html>
